name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the repo and runs checks — it never needs write. Least-privilege
# token so a compromised action/dependency can't push or open PRs with it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so check:data-version can diff the catalog against
          # origin/main (the default base ref).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      # Cache only Bun's global install cache (not node_modules); Bun rebuilds
      # node_modules from it. Keyed on the lockfile so a dep change busts it.
      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        # Triggers apps/api's `postinstall: prisma generate` — no separate step needed.

      - name: Check catalog images (no upstream hotlinks)
        # Fails if apps/web/public/data still points at content/wiki.warframe.com
        # — i.e. a catalog was committed without running `bun run sync:images`.
        run: bun run check:images

      - name: Check catalog cache-version bumped
        # A push creating a branch has an all-zeros `before` — nothing to diff.
        if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
        # Fails if apps/web/public/data changed without a fresh meta.json
        # generatedAt — a hand-edit that would be masked by the immutable
        # ?v=<generatedAt> cache. Fix with `bun run data:stamp`.
        env:
          # PR: the target branch (the script diffs from its merge-base). Push:
          # the pre-push SHA — origin/main would be HEAD itself and always pass.
          # fetch-depth:0 above makes both reachable.
          DATA_VERSION_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
        run: bun run check:data-version

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Check link-rendered Buttons
        # Base UI errors when a <Button render={<Link…/>}> keeps nativeButton.
        run: bun run check:native-button

      - name: Check import layering
        # Rules and reasons: scripts/lib/layering.ts.
        run: bun run check:layering

      - name: Build (web)
        # Must run before typecheck — @tanstack/router-plugin generates
        # apps/web/src/routeTree.gen.ts during vite build, and tsgo fails
        # in apps/web without it.
        working-directory: apps/web
        run: bun run build

      - name: Check Worker configs (wrangler dry-run)
        # After Build (web) — apps/web's [assets] directory is ./dist.
        run: bun run check:wrangler

      - name: Type-check (all workspaces)
        run: bun run typecheck

      - name: Test (workspaces + build pipeline)
        run: bun run test
