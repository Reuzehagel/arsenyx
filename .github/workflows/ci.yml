name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
        # Triggers apps/api's `postinstall: prisma generate` — no separate step needed.

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Type-check (all workspaces)
        run: bun run typecheck

      - name: Build (web)
        working-directory: apps/web
        run: bun run build

      - name: Test (all workspaces)
        run: bun --filter=arsenyx-web --filter=arsenyx-api --filter=@arsenyx/shared run test
