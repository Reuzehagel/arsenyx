name: Update Warframe Data

on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 02:00 UTC
  workflow_dispatch: {} # Manual trigger

# The pipeline pulls game data directly from DE PublicExport and the wiki
# Lua modules — no npm dep to bump. Diff covers `data/raw/de/`,
# `data/raw/wiki/`, and `apps/web/public/data/`.

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Sync upstream + rebuild items
        run: bun run data:bump

      # No typecheck/lint/test here — this job only refreshes data and opens a
      # PR. That PR triggers ci.yml, which runs the full gauntlet (web build →
      # typecheck → tests → check:images) with the build-first ordering that
      # generates apps/web/src/routeTree.gen.ts (gitignored). Running
      # `bun run typecheck` here without that build step fails in apps/web.

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/raw/ apps/web/public/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/update-warframe-data
          title: "chore: refresh Warframe game data"
          body: |
            Automated weekly refresh:

            - DE PublicExport mirror (`data/raw/de/`)
            - Wiki Lua modules (`data/raw/wiki/`)
            - Rebuilt catalog (`apps/web/public/data/`)

            Review the JSON diffs and the wiki mirror diff before merging.
            Any new wiki Class strings or DE compatNames not yet curated
            will fail the build — fix `data/curated/` if so.

            ⚠ This catalog still points at the upstream CDNs — the cron has
            no R2 creds, so `sync:images` was skipped and CI's `check:images`
            guard will fail. Before merging, check out this branch locally and
            run `bun run sync:images` (mirrors new images into R2 + rewrites
            the catalog to img.arsenyx.com), then push.
          commit-message: "chore: refresh Warframe game data"
