name: Changelog

# Separate from ci.yml so adding/removing the no-changelog or schema-applied
# label re-runs only these cheap checks, not the whole build.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13 # keep in sync with ci.yml

      - name: Check changelog entry
        env:
          CHANGELOG_BASE: origin/${{ github.base_ref }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: bun run check:changelog

      # Workers Builds deploys the API on merge, and Prisma reads new columns
      # and tables at once, so a schema change merged before its migration is
      # on prod breaks every query that touches it.
      # A label added for an earlier schema change doesn't cover a later one,
      # so a push that touches the schema fails even when labeled. Re-adding
      # the label re-runs this as a `labeled` event, which passes.
      - name: Check schema applied to prod
        env:
          BASE: origin/${{ github.base_ref }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'schema-applied') }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          schema=apps/api/prisma/schema.prisma
          if [ "$LABELED" != true ]; then
            if git diff --name-only "$BASE...HEAD" | grep -qx "$schema"; then
              echo "::error::This PR changes schema.prisma. Apply its apps/api/scripts/migrations/ SQL to prod, then add the schema-applied label."
              exit 1
            fi
          elif [ "$ACTION" = synchronize ]; then
            # A force-push can drop BEFORE from history; treat that as changed.
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || git diff --name-only "$BEFORE" "$AFTER" | grep -qx "$schema"; then
              echo "::error::This push changed schema.prisma after the schema-applied label. Apply the new SQL to prod, then remove and re-add the label."
              exit 1
            fi
          fi

      # The squash commit is built from these commits, so this keeps AI
      # attribution out of main even from sessions without the local hooks.
      - name: Check for AI attribution
        env:
          BASE: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic)|generated with.*claude'
          if { git log --format=%B "$BASE..HEAD"; printf '%s\n' "$PR_BODY"; } | grep -iE "$pattern"; then
            echo "::error::Remove the Claude co-author / 'Generated with Claude Code' lines above from the PR commits or description."
            exit 1
          fi
